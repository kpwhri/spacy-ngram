[project]
name = 'spacy-ngram'
version = '1.0.0'
authors = [
    { name = 'dcronkite', email = 'dcronkite+pypi@gmail.com' }
]
license = { file = 'LICENSE'}
description = 'SpaCy pipeline component for adding document or sentence-level ngrams.'
dependencies = [
    "spacy>=3.5.0",
]
requires-python = '>=3.10'
readme = 'README.md'
keywords = ['nlp', 'ngrams', 'spacy', 'spacy-extension']
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Text Processing :: Linguistic',
    'License :: OSI Approved :: MIT License',
    'Operating System :: OS Independent',
]

[project.optional-dependencies]
dev = [
    'pytest>=8.0.0',
]

[dependency-groups]
dev = [
    'pytest>=8.0.0',
]

[project.urls]
Homepage = 'https://github.com/kpwhri/spacy-ngram'
Repository = 'https://github.com/kpwhri/spacy-ngram'
Issues = 'https://github.com/kpwhri/spacy-ngram/issues'
Changelog = 'https://github.com/kpwhri/spacy-ngram/blob/main/CHANGELOG.md'

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
pythonpath = 'src'

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
